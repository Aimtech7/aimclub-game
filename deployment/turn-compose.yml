# Linux host with a public address, opened ports and TLS certificates.
# Copy .env.example to .env alongside this file; never commit that .env.
services:
  turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./certs:/certs:ro
    command:
      - -n
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?Set a strong TURN_SHARED_SECRET}
      - --realm=${TURN_REALM:?Set your public TURN hostname}
      - --external-ip=${TURN_PUBLIC_IP:?Set the public relay IPv4 address}
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=49160
      - --max-port=49200
      - --cert=/certs/fullchain.pem
      - --pkey=/certs/privkey.pem
      - --no-cli
      - --no-multicast-peers
      - --no-loopback-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --user-quota=6
      - --total-quota=100
      - --log-file=stdout
